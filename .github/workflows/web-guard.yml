name: Web Guard

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  typecheck:
    name: Typecheck & Lint
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
      - run: npm ci
      - run: npx tsc --noEmit
      - name: Lint (warning only)
        run: npm run lint
        continue-on-error: true

  db-guard:
    name: Supabase Migration Check
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 2
      - uses: dorny/paths-filter@v3
        id: sql
        with:
          filters: |
            sql:
              - '**/*.sql'
              - 'supabase/**'
      - if: steps.sql.outputs.sql == 'true'
        uses: supabase/setup-cli@v1
        with:
          version: latest
      - if: steps.sql.outputs.sql == 'true'
        run: |
          supabase init --force
          supabase db start
          supabase db reset --no-seed

  gitleaks:
    name: Secret Scan
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: gitleaks/gitleaks-action@v2
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
